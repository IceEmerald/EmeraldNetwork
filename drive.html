<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmeraldNetwork | Drive</title>
    <meta name="description" content="EmeraldNetwork Drive — your files, folders and storage in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles/style.css">
    <link rel="stylesheet" href="/assets/styles/wiki.css?v=5">
    <link rel="stylesheet" href="/assets/styles/drive.css?v=3">
    <link rel="stylesheet" href="/assets/styles/drive-sky.css">
    <link rel="stylesheet" href="/assets/styles/app-skeleton.css">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.webp">
    <link rel="icon" href="/assets/images/favicon.ico" sizes="any">
    <meta name="color-scheme" content="light dark">
    <script>

        (function () {
            try {
                var t = JSON.parse(localStorage.getItem('emeraldcore.wiki.theme'));
                document.documentElement.setAttribute('data-wiki-theme', t === 'dark' ? 'dark' : 'light');
            } catch (e) {  }
        }());
    </script>
</head>

<body class="wiki-page">

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>

<div class="wiki-root">

    <header class="su-top">
        <button class="icon-btn drive-hamburger" aria-label="Open navigation" onclick="openMobileSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <a href="/" class="logo" aria-label="EmeraldNetwork home">
            <img src="/assets/images/favicon.webp" width="28" height="28" alt="">
        </a>

        <div class="su-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" data-wiki-search placeholder="Search your drive" autocomplete="off" spellcheck="false" aria-label="Search your drive">
            <button class="wiki-search-clear" aria-label="Clear search">&times;</button>
        </div>

        <div class="su-top-right">
            <button class="icon-btn wiki-theme-btn" title="Theme" aria-label="Change theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="su-profile-btn" id="profileBtn" title="Account" aria-label="Open your account" aria-haspopup="dialog" aria-expanded="false">
                <span id="profileInitial">E</span>
                <img id="profileAvatar" src="" alt="" hidden>
            </button>
        </div>
    </header>

    <div class="drive-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-nav">
                <span class="sidebar-active-pill" id="sidebarActivePill" aria-hidden="true"></span>
                <div class="create-upload-wrap" id="createUploadWrap">
                    <button class="sidebar-btn new-chat" id="createUploadBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="createUploadMenu">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                        <span class="sidebar-btn-label">Create or upload</span>
                    </button>
                    <div class="create-upload-menu" id="createUploadMenu" role="menu" aria-label="Create or upload" aria-hidden="true" inert>
                        <div class="create-upload-menu-inner">
                            <button type="button" role="menuitem" data-create-action="folder">New Folder</button>
                            <button type="button" role="menuitem" data-create-action="file">Upload File</button>
                            <button type="button" role="menuitem" data-create-action="directory">Upload Folder</button>
                        </div>
                    </div>
                </div>
                <button class="sidebar-btn active" data-drive-nav="home">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span class="sidebar-btn-label">Home</span>
                </button>
                <button class="sidebar-btn" data-drive-nav="mydrive">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span class="sidebar-btn-label">My Drive</span>
                </button>
                <button class="sidebar-btn" data-drive-nav="shared">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span class="sidebar-btn-label">Shared with me</span>
                </button>
                <button class="sidebar-btn" data-drive-nav="recent">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span class="sidebar-btn-label">Recent</span>
                </button>
                <button class="sidebar-btn" data-drive-nav="starred">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <span class="sidebar-btn-label">Starred</span>
                </button>
                <button class="sidebar-btn" data-drive-nav="trash">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                    <span class="sidebar-btn-label">Trash</span>
                </button>
            </div>
            <div class="sidebar-history" id="sidebarHistory">
            </div>
            <div class="sidebar-footer">
                <div class="drive-storage">
                    <div class="drive-storage-title">Storage</div>
                    <div class="drive-storage-bar"><span id="driveStorageBar" style="width:0%"></span></div>
                    <span class="drive-storage-label" id="driveStorageLabel">Loading storage…</span>
                </div>
            </div>
        </aside>
        <main class="drive-main" aria-label="Drive content">
            <div class="drive-toolbar">
                <nav class="drive-crumbs" id="driveCrumbs" aria-label="Breadcrumb"></nav>
                <div class="drive-toolbar-actions">
                    <div class="drive-viewtoggle" id="viewToggle" role="group" aria-label="Layout">
                        <button class="active" data-layout="grid" title="Grid view" aria-label="Grid view">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                        </button>
                        <button data-layout="list" title="List view" aria-label="List view">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                        </button>
                    </div>
                    <div class="drive-sort" id="sortWrap">
                        <button class="drive-sort-btn" id="sortBtn" aria-haspopup="listbox" aria-expanded="false">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
                            <span id="sortLabel">Modified</span>
                        </button>
                        <div class="drive-sort-menu" id="sortMenu" hidden role="listbox" aria-label="Sort by">
                            <button class="active" data-sort="modified" role="option" aria-selected="true">Modified</button>
                            <button data-sort="name" role="option" aria-selected="false">Name</button>
                            <button data-sort="size" role="option" aria-selected="false">Size</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="driveContent" aria-live="polite"></div>
        </main>
    </div>
</div>

<div id="custom-context-menu" class="rightclick-menu">
    <div class="context-section">
        <span class="context-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.7 5.7L3 18v3h3l6-6a4 4 0 0 0 5.7-5.7l-2.4 2.4-3-3z"/></svg>TOOLS</span>
        <a onclick="copyTextContent()">Copy Text</a>
        <a onclick="copyPageLink()">Copy Page Link</a>
        <a onclick="showElementInfo()">Show Element Info</a>
        <a href="#" role="menuitem" data-context-action="drive-paste" style="display:none">Paste</a>
    </div>
</div>
<div id="custom-toast" class="custom-toast"></div>

<div class="drive-modal-overlay" id="driveModal" hidden>
    <section class="drive-modal" role="dialog" aria-modal="true" aria-labelledby="driveModalTitle">
        <div class="drive-modal-header"><h2 id="driveModalTitle"></h2><button type="button" id="driveModalClose" aria-label="Close dialog">&times;</button></div>
        <div class="drive-modal-body" id="driveModalBody"></div>
        <div class="drive-modal-actions" id="driveModalActions"></div>
    </section>
</div>

<div class="account-pop" id="accountPop" hidden role="dialog" aria-label="Your account">
    <div class="account-pop-top"><div class="account-brand" id="accountProvider"></div><button id="accountSignOut" type="button">Sign out</button></div>
    <div class="account-pop-user">
        <div class="account-pop-photo"><span id="accountPopInitial">E</span><img id="accountPopAvatar" src="" alt="" hidden></div>
        <div class="account-pop-details"><h2 id="accountPopName">Emerald user</h2><p id="accountPopEmail" title=""></p><a href="/account">View account</a></div>
    </div>
</div>

<script src="/assets/scripts/rightclick.js"></script>
<script src="/assets/scripts/idb-storage.js"></script>
<script src="/assets/scripts/auth-client.js?v=5"></script>
<script src="/assets/scripts/auth-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js" integrity="sha384-osZDKVu4ipZP703HmPOhWdyBajcFyjX2Psjk//TG1Rc0AdwEtuToaylrmcK3LdAl" crossorigin="anonymous"></script>
<script src="/assets/scripts/docxexport.js"></script>
<script src="/assets/scripts/footer-year.js"></script>
    <script src="/assets/scripts/activity-history.js?v=5"></script>
<script src="/assets/scripts/drive.js?v=3"></script>
</body>
</html>
