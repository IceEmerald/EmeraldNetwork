<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmeraldStudio | Flowchart</title>
    <meta name="description"
        content="EmeraldStudio Flowchart — a visual flowchart programming environment. Build, run, and debug algorithms visually.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/flowchart.css">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
    <link rel="apple-touch-icon" href="/assets/images/favicon.webp">
</head>

<body>
    <div class="flowchart-app">

        <main class="fc-canvas-wrap" id="canvas-wrap">
            <div id="canvas">
                <div id="canvas-content">
                    <svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg>
                    <div id="shapes-layer"></div>
                </div>
            </div>

            <div class="fc-ribbon" id="fc-ribbon">
                <div class="ribbon-row" id="menubar">
                    <button class="ribbon-btn primary icon-only" id="btn-run" title="Run">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3" />
                        </svg>
                    </button>
                    <button class="ribbon-btn icon-only" id="btn-step" title="Step">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 4 15 12 5 20 5 4" />
                            <line x1="19" y1="5" x2="19" y2="19" />
                        </svg>
                    </button>
                    <button class="ribbon-btn danger icon-only" id="btn-stop" disabled title="Stop">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="5" width="14" height="14" rx="2" />
                        </svg>
                    </button>
                    <button class="ribbon-btn icon-only" id="btn-reset" title="Reset">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                        </svg>
                    </button>
                    <div class="ribbon-divider"></div>
                    <input type="range" id="speed-slider" min="1" max="100" value="70" title="Execution speed">
                    <span id="speed-display" class="speed-display">30ms</span>
                </div>
            </div>
        </main>

        <div class="fc-brand-pill">
            <img src="/assets/images/favicon.webp" alt="EmeraldStudio" class="fc-brand-icon">
            <span class="fc-brand-text">EmeraldStudio Flowchart</span>
        </div>

        <div class="fc-file-bar" id="fc-file-bar">
            <button class="file-btn" id="btn-save" type="button" title="Save flowchart to a .emeraldcore file">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                <span>Save</span>
            </button>
            <button class="file-btn" id="btn-open" type="button" title="Open a .emeraldcore flowchart file">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                <span>Open</span>
            </button>
            <button class="file-btn" id="btn-export-png" type="button" title="Export flowchart as a PNG">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="14" rx="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="M21 15l-5-5L5 21" />
                    <path d="M12 21h8" />
                    <path d="M16 17l4 4 4-4" />
                </svg>
                <span>Export</span>
            </button>
            <div class="file-bar-divider" aria-hidden="true"></div>
            <button class="file-btn danger" id="btn-clear" type="button" title="Clear the canvas and start fresh">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                </svg>
                <span>Clear</span>
            </button>
        </div>

        <aside class="fc-palette" id="palette">
            <div class="palette-section">
                <div class="palette-section-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 5h16M4 12h16M4 19h10" />
                    </svg>
                    <span>Statements</span>
                </div>
                <div class="palette-grid">
                    <div class="palette-item" data-type="terminal" draggable="true">
                        <div class="palette-shape-mini mini-terminal"></div>
                        <div class="palette-label">Terminal</div>
                    </div>
                    <div class="palette-item" data-type="declare" draggable="true">
                        <div class="palette-shape-mini mini-declare"></div>
                        <div class="palette-label">Declare</div>
                    </div>
                    <div class="palette-item" data-type="process" draggable="true">
                        <div class="palette-shape-mini mini-assign"></div>
                        <div class="palette-label">Assign</div>
                    </div>
                    <div class="palette-item" data-type="input" draggable="true">
                        <div class="palette-shape-mini mini-input"></div>
                        <div class="palette-label">Input</div>
                    </div>
                    <div class="palette-item" data-type="output" draggable="true">
                        <div class="palette-shape-mini mini-output"></div>
                        <div class="palette-label">Output</div>
                    </div>
                    <div class="palette-item" data-type="decision" draggable="true">
                        <div class="palette-shape-mini mini-if"></div>
                        <div class="palette-label">If</div>
                    </div>
                    <div class="palette-item" data-type="loop" draggable="true">
                        <div class="palette-shape-mini mini-while"></div>
                        <div class="palette-label">While</div>
                    </div>
                    <div class="palette-item" data-type="for" draggable="true">
                        <div class="palette-shape-mini mini-for"></div>
                        <div class="palette-label">For</div>
                    </div>
                    <div class="palette-item" data-type="do" draggable="true">
                        <div class="palette-shape-mini mini-do"></div>
                        <div class="palette-label">Do</div>
                    </div>
                    <div class="palette-item" data-type="call" draggable="true">
                        <div class="palette-shape-mini mini-call"></div>
                        <div class="palette-label">Call</div>
                    </div>
                </div>
            </div>
            <div class="palette-section">
                <div class="palette-section-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="5" cy="5" r="1" /><circle cx="12" cy="5" r="1" /><circle cx="19" cy="5" r="1" />
                        <circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" />
                        <circle cx="5" cy="19" r="1" /><circle cx="12" cy="19" r="1" /><circle cx="19" cy="19" r="1" />
                    </svg>
                    <span>Miscellaneous</span>
                </div>
                <div class="palette-grid">
                    <div class="palette-item" data-type="comment" draggable="true">
                        <div class="palette-shape-mini mini-comment"></div>
                        <div class="palette-label">Comment</div>
                    </div>
                    <div class="palette-item" data-type="breakpoint" draggable="true">
                        <div class="palette-shape-mini mini-breakpoint"></div>
                        <div class="palette-label">Breakpoint</div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="fc-side-panels" id="side-panels">
        <section class="fc-panel" id="panel-variables" data-panel="variables">
            <div class="panel-header">
                <span class="panel-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                        <line x1="12" y1="22.08" x2="12" y2="12" />
                    </svg>
                    Variables
                </span>
                <div class="panel-header-actions">
                    <span class="panel-count" id="var-count">0</span>
                    <button class="panel-toggle" data-target="variables" title="Minimize / Maximize">
                        <svg class="toggle-chev" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="panel-body" id="variables-panel">
                <div class="var-empty">No variables yet. Run the program to see them.</div>
            </div>
        </section>

        <section class="fc-panel" id="panel-console" data-panel="console">
            <div class="panel-header">
                <span class="panel-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5" />
                        <line x1="12" y1="19" x2="20" y2="19" />
                    </svg>
                    Console
                </span>
                <div class="panel-header-actions">
                    <button class="panel-icon-btn" id="btn-clear-console" title="Clear console">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
                        </svg>
                    </button>
                    <button class="panel-toggle" data-target="console" title="Minimize / Maximize">
                        <svg class="toggle-chev" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="panel-body panel-body-flush">
                <div id="console">
                    <div class="console-line console-info">Ready. Build a flowchart and press Run.</div>
                </div>
            </div>
        </section>
        </div>
    </div>

    <input type="file" id="file-input" accept=".emeraldcore">
    <div id="context-menu" class="fc-context-menu"></div>
    <div id="toast" class="fc-toast"></div>

    <script src="assets/scripts/idb-storage.js"></script>
    <script src="assets/scripts/auth-client.js?v=5"></script>
    <script src="assets/scripts/auth-guard.js"></script>
    <script src="assets/scripts/flowchart.js?v=1"></script>
    <script src="assets/scripts/rightclick.js"></script>
    <script src="/assets/scripts/activity-history.js?v=5"></script>
</body>

</html>
