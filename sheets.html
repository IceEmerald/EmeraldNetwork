<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldSuite | Sheets</title>
<meta name="description" content="EmeraldSuite Sheets — a complete client-side spreadsheet application. All data stays in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/assets/images/sheetsicon.webp">
<link rel="stylesheet" href="/assets/styles/style.css">
<link rel="stylesheet" href="/assets/styles/sheets.css">
</head>
<body>
<div id="app" role="application" aria-label="EmeraldSuite spreadsheet application">

  <!-- ===================== Navbar (utilizing style.css) ===================== -->
  <header class="navbar sticky-top">
    <div class="navcontainer nav-container">
      <a href="/" class="logo">
        <img src="/assets/images/sheetsicon.webp" width="30" height="30" class="icon-primary" alt="Sheets">
        <span class="logo-text">EmeraldSuite</span>
      </a>
      <nav class="nav-links">
        <button class="save-indicator" id="saveIndicator">
          <span class="save-text" id="save-status" role="status" aria-live="polite">All changes saved</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ===================== WELCOME SCREEN (home / workbook overview) ===================== -->
  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-content">
      <div class="welcome-header">
        <div style="margin-top:2rem;"></div>
        <div class="welcome-header-top">
          <img src="/assets/images/sheetsicon.webp" width="48" height="48" alt="EmeraldSuite Sheets" class="welcome-logo">
          <h3>Welcome to EmeraldSuite Sheets!</h3>
        </div>
        <div class="welcome-section-title">
          <h3>Your spreadsheets</h3>
          <div class="welcome-actions">
            <button class="create-sheet-btn" id="welcomeNewBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Create New Spreadsheet
            </button>
            <button class="create-sheet-btn create-sheet-btn--secondary" id="welcomeImportBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Import File
            </button>
          </div>
        </div>
      </div>
      <div class="welcome-section">
        <div class="sheet-list-display" id="workbooksDisplay"></div>
        <div class="no-sheets-container" id="noSheetsContainer">
          <div class="show-phone-only" style="margin-top:4rem;"></div>
          <img src="/assets/images/nosheets.webp" alt="" class="no-sheets-img">
          <p class="no-sheets-hint">Create your first spreadsheet to get started</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= Ribbon ======= -->
  <div id="ribbon">
    <div id="ribbon-tabs" role="tablist" aria-label="Ribbon tabs"></div>
    <div id="ribbon-body" role="tabpanel"></div>
  </div>

  <!-- ======= Name box + formula bar ======= -->
  <div id="formula-row">
    <div id="name-box-wrap">
      <input id="name-box" type="text" aria-label="Name Box — type a cell address or range and press Enter" spellcheck="false" autocomplete="off">
      <button id="name-box-dd" class="namebox-dd" title="Named ranges" aria-label="Named ranges list"></button>
    </div>
    <div class="fx-group" role="group" aria-label="Formula bar controls">
      <button id="fx-cancel" class="iconbtn" title="Cancel (Esc)" aria-label="Cancel edit"></button>
      <button id="fx-confirm" class="iconbtn" title="Confirm (Enter)" aria-label="Confirm edit"></button>
      <button id="fx-insert" class="fx-btn" title="Insert Function" aria-label="Insert Function">fx</button>
    </div>
    <div id="formula-bar-wrap">
      <textarea id="formula-input" rows="1" aria-label="Formula bar" spellcheck="false"></textarea>
    </div>
    <div class="expand-grip" id="formula-expand" title="Expand formula bar" aria-label="Expand formula bar"></div>
  </div>

  <!-- ======= Spreadsheet grid ======= -->
  <main id="grid-area">
    <canvas id="grid-canvas"></canvas>
    <textarea id="cell-editor" aria-label="Cell editor" spellcheck="false"></textarea>
    <div id="filter-btn-layer" aria-hidden="true"></div>
    <div id="dv-btn-layer" aria-hidden="true"></div>
    <div id="chart-layer" aria-label="Floating charts"></div>
    <div id="fill-tip" aria-hidden="true"></div>
    <div id="size-tip" aria-hidden="true"></div>
    <div id="drag-hint" aria-hidden="true"></div>
  </main>

  <!-- ======= Bottom bar: sheet tabs (left) + status count & zoom (right) ======= -->
  <footer id="status-bar" role="region" aria-label="Sheet tabs and status">
    <div class="sb-sheets">
      <div class="tab-nav" role="group" aria-label="Sheet tab navigation">
        <button id="tab-home" class="iconbtn" title="Scroll to start" aria-label="Scroll sheet tabs to start"></button>
        <button id="tab-prev" class="iconbtn" title="Scroll left" aria-label="Scroll sheet tabs left"></button>
        <button id="tab-next" class="iconbtn" title="Scroll right" aria-label="Scroll sheet tabs right"></button>
        <button id="tab-end" class="iconbtn" title="Scroll to end" aria-label="Scroll sheet tabs to end"></button>
        <button id="add-sheet" title="New sheet" aria-label="Add worksheet"></button>
      </div>
      <div id="sheet-tabs" role="tablist" aria-label="Worksheets"></div>
    </div>
    <div class="sb-right">
      <span id="sb-stats" class="statbar-item" title="Count of values in the current selection"></span>
      <span class="sb-sep" aria-hidden="true"></span>
      <button id="sb-zoom-pct" class="statbar-toggle" title="Reset zoom to 100%">100%</button>
    </div>
  </footer>
</div>

<!-- ===================== File Management Modal (Docs/Slides-style Backstage overlay) ===================== -->
<div class="file-overlay" id="fileModal" role="dialog" aria-label="File">
  <div class="file-overlay-card">
    <!-- Header -->
    <div class="file-overlay-header">
      <span class="file-overlay-header-title">File</span>
      <button class="file-overlay-close-btn" id="fileModalCloseXBtn" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <!-- Body -->
    <div class="file-overlay-body">
      <!-- Workbook name -->
      <div class="file-overlay-section">
        <div class="file-overlay-section-label">Name</div>
        <input class="file-overlay-name-input" id="fileModalNameInput" type="text" placeholder="Untitled workbook" autocomplete="off" spellcheck="false" />
      </div>
      <!-- Actions -->
      <div class="file-overlay-section">
        <div class="file-overlay-section-label">Actions</div>
        <div class="file-overlay-actions-row">
          <button class="file-overlay-action-btn file-overlay-action-btn--danger" id="fileDeleteBtn" title="Delete this workbook from browser storage">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Delete
          </button>
          <button class="file-overlay-action-btn" id="fileCloseBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            Close
          </button>
        </div>
      </div>
      <!-- Document -->
      <div class="file-overlay-section">
        <div class="file-overlay-section-label">Document</div>
        <button class="file-overlay-action-btn" id="fileNewBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          New workbook
        </button>
        <button class="file-overlay-action-btn" id="fileOpenBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Open document…
        </button>
        <button class="file-overlay-action-btn" id="fileImportBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Import CSV / XLSX…
        </button>
      </div>
      <!-- Export -->
      <div class="file-overlay-section">
        <div class="file-overlay-section-label">Export</div>
        <button class="file-overlay-action-btn" id="fileExportXlsxBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 12 6 6m0-6-6 6"/></svg>
          Export as Workbook (.xlsx)
        </button>
        <button class="file-overlay-action-btn" id="fileExportCsvBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
          Export as CSV (active sheet)
        </button>
        <button class="file-overlay-action-btn" id="filePrintBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print / PDF
        </button>
        <button class="file-overlay-action-btn" id="fileSaveAsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save as copy…
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Overlays -->
<div id="find-panel" role="dialog" aria-label="Find and Replace" hidden></div>
<div id="modal-root"></div>
<div id="popup-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>
<textarea id="clip-helper" aria-hidden="true" tabindex="-1"></textarea>

<!-- SheetJS (XLSX import/export) — optional; the app degrades gracefully if unavailable -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous" onerror="window.__XLSX_CDN_FAIL=true"></script>
<script src="/assets/scripts/sheets.js"></script>
</body>
</html>
