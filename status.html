    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

        <div class="navcontainer nav-container">
            <a href="/" class="logo">
                <img src="/assets/images/favicon.webp" width="30" height="30" class="icon-primary">
                <span class="logo-text">EmeraldNetwork</span>
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="#incidents-section">Incidents</a>
            </nav>
        </div>
    </header>
    <div id="custom-context-menu" class="rightclick-menu">
        <div class="context-section">
            <span class="context-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;display:inline-block"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Tools</span>

            <a onclick="copyPageLink()">Copy Page Link</a>
            <a onclick="showElementInfo()">Show Element Info</a>
        </div>
    </div>
    <div id="custom-toast" class="custom-toast"></div>
    <main>
        <div class="status-page">

            <div class="status-hero animate-on-scroll">
                <div class="status-hero-icon operational" id="hero-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h1 class="animate-on-scroll" id="overall-status" style="-webkit-text-fill-color: transparent;"></h1>
                <p class="animate-on-scroll" id="last-updated">Last updated: <span id="update-time"></span></p>
            </div>

            <div id="services-list"></div>

            <div id="incidents-section">
                <div class="section-label animate-on-scroll" id="label-current" style="display:none;">Current Incidents</div>
                <div id="current-incidents-list"></div>
                <div class="section-label animate-on-scroll">Previous Incidents</div>
                <div id="previous-incidents-list"></div>
            </div>

        </div>
    </main>
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-brand">
                <img src="/assets/images/favicon.webp" alt="EmeraldNetwork logo" class="footer-logo">
                <div>
                    <p class="footer-brand-name">EmeraldNetwork</p>
                    <p class="footer-brand-tagline">Shaping the future of connection, intelligence, and digital possibility.</p>
                </div>
            </div>
            <div class="footer-social-links">
                <a href="https://youtube.com/iceemerald" target="_blank" rel="noopener noreferrer" class="social-icon-button-footer" aria-label="YouTube">

                <a href="mailto:hello@emeraldnetwork.groups.id" class="social-icon-button-footer" aria-label="Email">
