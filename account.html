<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmeraldNetwork | Sign in</title>
    <meta name="description" content="Sign in to EmeraldNetwork or create an account to access your notes, documents, presentations and spreadsheets — synced in one place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles/account.css" />
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.webp">
</head>

<body>
    <main class="auth-shell">

        <!-- ================= Sky half ================= -->
        <!-- Half the screen wrapped in a rounded daylight card:
             bright emerald sky with a soft light sweep, the
             EmeraldNetwork wordmark top-left, the campaign
             headline centered, and a giant realistic planet
             rising from the bottom (only a quarter of the disc
             is ever on screen). -->
        <aside class="auth-visual">
            <a href="/" class="logo" aria-label="EmeraldNetwork home">
                <img src="/assets/images/favicon.webp" class="icon-primary" width="30" height="30" alt="EmeraldNetwork logo">
                <span class="logo-text">EmeraldNetwork</span>
            </a>

            <div class="visual-stars" id="visualStars" aria-hidden="true"></div>

            <h2 class="brand-headline" aria-hidden="true">
                Shape the <em>future</em>&hellip;<br>
                <span class="from-you">From you.</span>
            </h2>

            <div class="globe" aria-hidden="true">
                <canvas id="globe-canvas"></canvas>
            </div>
        </aside>

        <!-- ================= Login half ================= -->
        <section class="auth-panel">
            <!-- Compact wordmark shown on phone (sky half is hidden) -->
            <a href="/" class="mobile-logo" aria-label="EmeraldNetwork home">
                <img src="/assets/images/favicon.webp" class="icon-primary" width="30" height="30" alt="EmeraldNetwork logo">
                <span class="logo-text">EmeraldNetwork</span>
            </a>

            <!-- Switches between login and register — pinned top-right -->
            <header class="panel-top">
                <p class="switch-note" id="switchNote"></p>
            </header>

            <div class="auth-inner">

                <div class="form-card">
                    <h1 class="form-card-title" id="formCardTitle">Welcome back!</h1>
                    <p class="form-card-subtitle" id="formCardSubtitle">
                        Sign in to your EmeraldNetwork account.
                    </p>

                    <!-- ============ LOGIN ============ -->
                    <form class="auth-form active" id="login-form" aria-labelledby="formCardTitle"
                        novalidate data-mode="login">
                        <div class="input-group">
                            <label for="login-email">Email address</label>
                            <input type="email" id="login-email" name="email" autocomplete="email"
                                placeholder="hello@emeraldnetwork.groups.id" spellcheck="false">
                            <p class="error-message" id="login-email-error" aria-live="polite"></p>
                        </div>

                        <div class="input-group">
                            <label for="login-password">Password</label>
                            <div class="input-wrap">
                                <input type="password" id="login-password" name="password"
                                    autocomplete="current-password" placeholder="Enter your password">
                                <button type="button" class="pw-toggle" aria-label="Show password"
                                    aria-pressed="false" data-target="login-password">
                                    <svg class="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="pw-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                            <p class="error-message" id="login-password-error" aria-live="polite"></p>
                        </div>

                        <div class="row-between">
                            <label class="remember">
                                <input type="checkbox" id="rememberMe" name="remember" class="remember-input">
                                <span class="remember-box" aria-hidden="true">
                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                </span>
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn primary">
                            Sign in
                            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>
                    </form>

                    <!-- ============ REGISTER ============ -->
                    <form class="auth-form" id="register-form" hidden
                        novalidate data-mode="register">
                        <div class="input-group">
                            <label for="register-email">Email address</label>
                            <input type="email" id="register-email" name="email" autocomplete="email"
                                placeholder="hello@emeraldnetwork.groups.id" spellcheck="false">
                            <p class="error-message" id="register-email-error" aria-live="polite"></p>
                        </div>

                        <div class="input-group">
                            <label for="register-password">Password</label>
                            <div class="input-wrap">
                                <input type="password" id="register-password" name="password"
                                    autocomplete="new-password" placeholder="Create a password (8+ characters)">
                                <button type="button" class="pw-toggle" aria-label="Show password"
                                    aria-pressed="false" data-target="register-password">
                                    <svg class="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="pw-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                            <p class="error-message" id="register-password-error" aria-live="polite"></p>
                        </div>

                        <div class="input-group">
                            <label for="register-confirm">Confirm Password</label>
                            <div class="input-wrap">
                                <input type="password" id="register-confirm" name="confirm"
                                    autocomplete="new-password" placeholder="Re-enter your password">
                                <button type="button" class="pw-toggle" aria-label="Show password"
                                    aria-pressed="false" data-target="register-confirm">
                                    <svg class="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="pw-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                            <p class="error-message" id="register-confirm-error" aria-live="polite"></p>
                        </div>

                        <button type="submit" class="btn primary">
                            Create account
                            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>
                    </form>

                    <div class="divider" role="separator" aria-label="Or continue with">
                        <span>or continue with</span>
                    </div>

                    <div class="social-buttons">
                        <button type="button" class="btn social-btn" id="googleBtn">
                            <svg class="social-logo" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                                <path fill="#4285F4"
                                    d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z" />
                                <path fill="#34A853"
                                    d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34A9 9 0 0 0 9 18z" />
                                <path fill="#FBBC05"
                                    d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.28-1.71V4.96H.96A8.98 8.98 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3.01-2.33z" />
                                <path fill="#EA4335"
                                    d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58A8.99 8.99 0 0 0 9 0 9 9 0 0 0 .96 4.96l3 2.33C4.68 5.16 6.66 3.58 9 3.58z" />
                            </svg>
                            Continue with Google
                        </button>

                        <button type="button" class="btn social-btn" id="microsoftBtn">
                            <svg class="social-logo" width="16" height="16" viewBox="0 0 21 21" aria-hidden="true">
                                <rect x="1" y="1" width="9" height="9" fill="#F25022" />
                                <rect x="11" y="1" width="9" height="9" fill="#7FBA00" />
                                <rect x="1" y="11" width="9" height="9" fill="#00A4EF" />
                                <rect x="11" y="11" width="9" height="9" fill="#FFB900" />
                            </svg>
                            Continue with Microsoft
                        </button>
                    </div>
                </div>

            <footer class="auth-footer">
                <p>
                    By continuing, you agree to EmeraldNetwork's
                    <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.
                </p>
            </footer>
        </section>
    </main>

    <!-- Right-click context menu (shared with index.html) -->
    <div id="custom-context-menu" class="rightclick-menu">
        <div class="context-section">
            <span class="context-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;display:inline-block"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Tools</span>
            <a onclick="copyTextContent()">Copy Text</a>
            <a onclick="copyPageLink()">Copy Page Link</a>
            <a onclick="showElementInfo()">Show Element Info</a>
        </div>
    </div>

    <!-- Site-wide toast (same pattern as index.html, notes.html, …) -->
    <div id="custom-toast" class="custom-toast" aria-live="polite"></div>

    <script src="/assets/scripts/account.js"></script>
    <script src="/assets/scripts/aboutgl.js"></script>
    <script src="/assets/scripts/rightclick.js"></script>
</body>

</html>
